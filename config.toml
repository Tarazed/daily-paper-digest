max_results_per_query = 10
years_back = 3
timeout_seconds = 8
max_failures = 3
max_total_results = 50
workers = 4
fallback_enabled = true
fallback_providers = ["openalex", "semantic_scholar"]
fallback_workers = 4

[email]
sender_name = "Daily Paper Digest"
default_to = ""
subject_prefix = "Daily Paper Digest"
top_n = 10

[site]
title = "Daily Paper Digest"
subtitle = "推荐系统、生成式推荐、LLM4Rec 与 Agent4Rec 论文追踪"
default_limit = 30

[summary]
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
analysis_model = "deepseek-v4-pro"
language = "zh"
max_sentences = 3
full_text_max_chars = 12000
full_text_timeout_seconds = 15
summary_workers = 4
analysis_workers = 3

[enrichment]
enabled = true
provider = "openalex"
mailto = ""
max_results = 3
source_enabled = true
source_max_papers = 30
source_timeout_seconds = 10
