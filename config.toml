state_file = "paper_state.toml"

[arxiv]
categories = ["cs.IR", "cs.AI", "cs.LG", "cs.CL", "cs.SI", "stat.ML"]
include_keywords = [
  # General recommendation
  "recommender system",
  "recommendation",
  "personalized recommendation",
  "sequential recommendation",
  "session-based recommendation",
  "conversational recommendation",
  "explainable recommendation",
  "interactive recommendation",

  # Generative recommendation
  "generative recommendation",
  "generative recommender",
  "generative recommender system",
  "generative sequential recommendation",
  "generative collaborative filtering",
  "generative ranking",
  "generative retrieval",
  "generative item retrieval",
  "autoregressive recommendation",

  # Semantic ID / tokenization / codebook
  "semantic id",
  "semantic identifier",
  "semantic token",
  "semantic tokenization",
  "item tokenization",
  "item identifier",
  "discrete item token",
  "discrete token recommendation",
  "codebook recommendation",
  "vector quantization recommendation",
  "residual quantization recommendation",
  "RQ-VAE recommendation",
  "VQ-VAE recommendation",
  "hierarchical identifier recommendation",

  # LLM4Rec
  "LLM4Rec",
  "LLM recommendation",
  "LLM recommender",
  "LLM-based recommendation",
  "large language model recommendation",
  "large language model recommender",
  "foundation model recommendation",
  "foundation model recommender",
  "instruction tuning recommendation",
  "prompt-based recommendation",
  "in-context learning recommendation",
  "zero-shot recommendation",
  "few-shot recommendation",
  "RAG recommendation",
  "retrieval augmented recommendation",
  "LLM user modeling",
  "user preference modeling LLM",
  "personalized LLM recommendation",

  # Agent4Rec
  "agent recommendation",
  "agent recommender",
  "agentic recommendation",
  "Agent4Rec",
  "LLM agent recommendation",
  "LLM agent recommender",
  "recommendation agent",
  "recommender agent",
  "multi-agent recommendation",
  "multi-agent recommender",
  "user simulator recommendation",
  "LLM user simulator",
  "generative agents recommendation",
  "tool-augmented recommendation",
  "planning recommendation agent",
  "reasoning recommendation agent"
]
exclude_keywords = [
  "advertising",
  "sponsored search",
  "ad recommendation",
  "ads recommendation",
  "advertisement recommendation",
  "medical recommendation",
  "clinical recommendation",
  "drug recommendation",
  "treatment recommendation",
  "policy recommendation",
  "recommendation letter",
  "citation recommendation",
  "review recommendation"
]
max_results = 50
days_back = 7

